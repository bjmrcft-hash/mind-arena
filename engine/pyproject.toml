[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-arena-engine"
version = "0.1.0"
description = "MindArena debate engine - multi-LLM structured debate system"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "edge-tts>=6.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
mind-arena = "engine.cli:main"
